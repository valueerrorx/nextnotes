<!-- Quelle: Microsoft Learn „Input and output HTML on OneNote pages“, Abschnitte „Paragraphs and headings“ und „Lists“ (Output HTML), https://learn.microsoft.com/en-us/graph/onenote-input-output-html; Code-Beispiele MIT. In einen _default-div gesetzt wie dort beschrieben. -->
<html lang="en-US">
<head><title>Styles</title></head>
<body data-absolute-enabled="true" style="font-family:Calibri;font-size:11pt">
<div data-id="_default" style="position:absolute;left:48px;top:120px;width:624px">
<h1 style="font-size:16pt;color:#1e4e79;margin-top:11pt;margin-bottom:11pt">Heading <span style="font-style:italic">One</span> text</h1>
<p style="text-align:center"><span style="font-family:Courier;font-size:8pt;color:green">Some text</span></p>
<p>Some <span style="font-family:Segoe UI Black;font-size:12pt;color:red">more</span> text</p>
<ol>
    <li style="list-style-type:upper-roman"><span style="color:blue;font-weight:bold">Jacksonville</span></li>
    <li style="list-style-type:upper-roman"><span style="color:blue;text-decoration:line-through">Orlando</span></li>
    <li style="list-style-type:upper-roman"><span style="font-family:Courier;color:blue">Naples</span></li>
</ol>
<ul>
    <li style="list-style-type:square"><span style="font-style:italic">square style</span></li>
    <li style="list-style-type:circle"><span style="font-style:italic">circle style</span></li>
    <li><span style="font-style:italic">disc style (default)</span></li>
</ul>
<p><span style="background-color:yellow;text-decoration:underline">Marked</span> and <span style="color:#000000;background-color:#FFFFFF">default colours</span></p>
</div>
</body>
</html>
