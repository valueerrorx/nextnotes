# Nur Tests. App wird per install-app.sh kopiert, nie gemountet (app:remove löscht das Verzeichnis).
name: nextnotes-dev

x-nc-env: &nc-env
  NEXTCLOUD_ADMIN_USER: admin
  NEXTCLOUD_ADMIN_PASSWORD: admin
  NEXTCLOUD_TRUSTED_DOMAINS: localhost

services:
  nc-sqlite:
    profiles: [sqlite]
    image: ${NC_APACHE_IMAGE:-nextcloud:35.0.2-apache}
    pull_policy: missing
    ports: ["127.0.0.1:8081:80"]
    environment:
      <<: *nc-env
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_INIT_HTACCESS: "1"
    volumes:
      - nc-sqlite:/var/www/html

volumes:
  nc-sqlite:
