# Manuelle Test-Instanz für Thomas. Von Agenten/Tests nie angefasst; Aktualisierung nur per update.sh nach einem Commit.
name: nextnotes-demo

services:
  db:
    image: postgres:17.11-alpine
    pull_policy: missing
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nextcloud", "-d", "nextcloud"]
      interval: 2s
      retries: 60
    volumes:
      - db:/var/lib/postgresql/data
    restart: unless-stopped

  nc:
    image: nextcloud:35.0.2-apache
    pull_policy: missing
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:8090:80"]
    environment:
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud
      NEXTCLOUD_INIT_HTACCESS: "1"
    volumes:
      - nc:/var/www/html
    restart: unless-stopped

  # Hintergrundjobs alle 5 min (OneNote-Import, Fristen, Aufräumen); offizielles Muster des Images
  cron:
    image: nextcloud:35.0.2-apache
    pull_policy: missing
    depends_on: [nc]
    entrypoint: /cron.sh
    volumes:
      - nc:/var/www/html
    restart: unless-stopped

volumes:
  db:
  nc:
